name: Publish npm

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @ceatoleii/specflow
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify package version matches release tag
        if: github.event_name == 'release'
        run: |
          PKG_VERSION=$(npm pkg get version -w @ceatoleii/specflow | tr -d '"')
          TAG="${{ github.event.release.tag_name }}"
          TAG="${TAG#v}"
          echo "package.json version: ${PKG_VERSION}"
          echo "release tag version:  ${TAG}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::Version mismatch. Bump packages/specflow/package.json to ${TAG} before publishing."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck -w @ceatoleii/specflow

      - name: Test with coverage
        run: npm run test:coverage -w @ceatoleii/specflow

      - name: Publish to npm
        run: npm publish -w @ceatoleii/specflow --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
